[package]
name = "foxinix-desktop"
version = "0.1.5"
description = "Foxinix para escritorio y Android"
authors = ["Foxinix"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "foxinix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: Prueba de arranque Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK x86_64 para emulador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android,armv7-linux-androideabi,aarch64-linux-android

      - name: Preparar y compilar
        working-directory: desktop
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.json
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/foxinix-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_STORE_PASSWORD}
          storeFile=${RUNNER_TEMP}/foxinix-release.jks
          EOF
          python3 ../.github/scripts/patch_android.py
          mkdir -p dist
          for target in x86_64-linux-android armv7-linux-androideabi aarch64-linux-android; do
            npx tauri android build --apk --target "$target"
            case "$target" in
              x86_64*) abi="x86_64" ;;
              armv7*)  abi="armeabi-v7a" ;;
              aarch64*) abi="arm64-v8a" ;;
            esac
            apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | tail -1)"
            cp "$apk" "dist/foxinix-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-android-x86_64
          path: desktop/dist/foxinix-x86_64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-android-armv7
          path: desktop/dist/foxinix-armeabi-v7a.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-android-arm64
          path: desktop/dist/foxinix-arm64-v8a.apk
          if-no-files-found: error

  emulator:
    name: Arrancar en emulador Android
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foxinix-android-x86_64
          path: .

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            adb install -r foxinix-x86_64.apk
            adb shell am start -W -n io.foxinix.app/.MainActivity
            sleep 25
            adb shell pidof io.foxinix.app
            adb exec-out screencap -p > foxinix-android.png
            adb logcat -d -t 250 | tail -120

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-android-captura
          path: foxinix-android.png
          if-no-files-found: error
